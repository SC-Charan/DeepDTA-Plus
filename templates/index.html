<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepDTA - Binding Affinity Predictor</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        .textarea-code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">
    
    <!-- Navbar -->
    <nav class="bg-white shadow-sm border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex-shrink-0 flex items-center gap-2">
                    <i class="fa-solid fa-dna text-blue-600 text-2xl"></i>
                    <span class="font-bold text-xl tracking-tight text-slate-900">DeepDTA</span>
                </div>
                <div>
                    <a href="https://github.com/hkmztrk/DeepDTA" target="_blank" class="text-slate-500 hover:text-slate-900 transition-colors">
                        <i class="fa-brands fa-github text-xl"></i>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center p-6">
        <div class="w-full max-w-2xl glass-card rounded-2xl shadow-xl overflow-hidden">
            
            <!-- Header section -->
            <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-8 text-white">
                <h1 class="text-3xl font-bold mb-2">Binding Affinity Prediction</h1>
                <p class="text-blue-100 text-sm">
                    Predict the interaction strength between a drug (SMILES) and a target protein using Convolutional Neural Networks.
                </p>
            </div>
            
            <!-- Form section -->
            <div class="p-8">
                <form id="prediction-form" class="space-y-6">
                    
                    <!-- Model Selection -->
                    <div>
                        <label for="model_type" class="block text-sm font-semibold text-slate-700 mb-2">
                            Select Dataset Model <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <select id="model_type" required class="appearance-none w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-3 pr-10 shadow-sm transition-all duration-200">
                                <option value="davis">Davis Dataset Model (Predicts pKd)</option>
                                <option value="kiba">KIBA Dataset Model (Predicts KIBA Score)</option>
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-500">
                                <i class="fa-solid fa-chevron-down text-sm"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Drug SMILES Input -->
                    <div>
                        <label for="smiles" class="block text-sm font-semibold text-slate-700 mb-2">
                            Drug SMILES String <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="smiles" placeholder="e.g., CC1=C(C=C(C=C1)NC(=O)C2=CC..." required class="textarea-code w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-3 shadow-sm transition-all duration-200">
                    </div>
                    
                    <!-- Protein Sequence Input -->
                    <div>
                        <label for="protein" class="block text-sm font-semibold text-slate-700 mb-2">
                            Target Protein Sequence <span class="text-red-500">*</span>
                        </label>
                        <textarea id="protein" rows="4" placeholder="e.g., MVGQLSEGVYMAVTGQ..." required class="textarea-code w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-3 shadow-sm transition-all duration-200 resize-y"></textarea>
                    </div>
                    
                    <!-- Action Button -->
                    <div class="pt-2">
                        <button type="submit" id="submit-btn" class="w-full text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-lg px-5 py-3.5 text-center shadow-md transition-all duration-200 flex justify-center items-center gap-2">
                            <i class="fa-solid fa-flask"></i> Predict Affinity
                        </button>
                    </div>

                    <!-- Loading State -->
                    <div id="loader" class="hidden py-4">
                        <div class="flex items-center justify-center space-x-2">
                            <div class="w-4 h-4 bg-blue-600 rounded-full animate-bounce" style="animation-delay: -0.3s;"></div>
                            <div class="w-4 h-4 bg-blue-600 rounded-full animate-bounce" style="animation-delay: -0.15s;"></div>
                            <div class="w-4 h-4 bg-blue-600 rounded-full animate-bounce"></div>
                        </div>
                        <p class="text-center text-sm text-slate-500 mt-3 font-medium animate-pulse">Analyzing molecular structures...</p>
                    </div>
                </form>
                
                <!-- Result Display -->
                <div id="result-box" class="hidden mt-6 rounded-lg p-5 border-l-4 transition-all duration-300 ease-in-out">
                    <!-- Content injected via JS -->
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-sm text-slate-500">
            Powered by DeepDTA Architecture &middot; <a href="#" class="hover:text-blue-600 transition-colors">Documentation</a>
        </div>
    </footer>

    <script>
        document.getElementById('prediction-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const modelType = document.getElementById('model_type').value;
            const smiles = document.getElementById('smiles').value;
            const protein = document.getElementById('protein').value;
            
            const resultBox = document.getElementById('result-box');
            const submitBtn = document.getElementById('submit-btn');
            const loader = document.getElementById('loader');
            
            // Reset UI states
            resultBox.classList.add('hidden');
            resultBox.innerHTML = '';
            submitBtn.classList.add('hidden');
            loader.classList.remove('hidden');
            
            fetch('/predict', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ model_type: modelType, smiles: smiles, protein: protein })
            })
            .then(response => response.json())
            .then(data => {
                // Restore button and hide loader
                submitBtn.classList.remove('hidden');
                loader.classList.add('hidden');
                resultBox.classList.remove('hidden');
                
                if (data.error) {
                    resultBox.className = 'mt-6 rounded-lg p-5 border-l-4 border-red-500 bg-red-50 text-red-700 shadow-sm';
                    resultBox.innerHTML = `
                        <div class="flex items-center gap-3">
                            <i class="fa-solid fa-circle-exclamation text-xl"></i>
                            <span class="font-semibold">${data.error}</span>
                        </div>`;
                } else {
                    let affinity_type = modelType === 'davis' ? 'pKd (Higher is stronger)' : 'KIBA Score (Lower is stronger)';
                    
                    resultBox.className = 'mt-6 rounded-lg p-6 border-l-4 border-emerald-500 bg-emerald-50 shadow-sm';
                    resultBox.innerHTML = `
                        <h3 class="text-emerald-800 font-bold text-lg mb-1">Prediction Complete</h3>
                        <div class="flex items-end gap-3 mt-3">
                            <span class="text-4xl font-black text-emerald-600">${data.affinity}</span>
                            <span class="text-emerald-700 font-medium pb-1">${affinity_type}</span>
                        </div>
                    `;
                }
            })
            .catch(err => {
                submitBtn.classList.remove('hidden');
                loader.classList.add('hidden');
                resultBox.classList.remove('hidden');
                
                resultBox.className = 'mt-6 rounded-lg p-5 border-l-4 border-red-500 bg-red-50 text-red-700 shadow-sm';
                resultBox.innerHTML = `
                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-triangle-exclamation text-xl"></i>
                        <span class="font-semibold">Connection Error. Please ensure the backend server is running.</span>
                    </div>`;
            });
        });
    </script>
</body>
</html>
